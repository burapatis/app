<!-- ✏️ [เพิ่มใน index.html หลัก] วันดีๆ App Card -->
<article class="app-card" style="border-top: 3px solid #2d6a4f;">
  <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px;">
    <!-- ✏️ ใส่ icon.png ใน apps/wandee/ -->
    <img src="./apps/wandee/icon.png"
         alt="วันดีๆ"
         style="width:64px; height:64px; border-radius:16px; object-fit:cover; box-shadow:0 2px 12px rgba(0,0,0,0.15);" />
    <div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;">
        <h3 style="margin:0; font-size:1.15rem;">วันดีๆ</h3>
        <span class="badge badge-coming">🧪 TestFlight</span>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <span class="badge badge-info">iOS</span>
        <span class="badge badge-gold">🔒 ข้อมูลในเครื่อง</span>
      </div>
    </div>
  </div>

  <p style="color:var(--text-muted); font-size:14px; line-height:1.8; margin-bottom:16px;">
    ไดอารี่สำหรับผู้สูงวัยไทย บันทึกความทรงจำดีๆ ด้วยข้อความ ภาพถ่าย และเสียง
    ตัวอักษรใหญ่ ใช้งานง่าย ไม่ต้องมีความรู้เทคโนโลยี
  </p>

  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <a href="./apps/wandee/index.html" class="btn btn-primary btn-sm"
       style="background:#2d6a4f;">
      ดูรายละเอียด →
    </a>
    <a href="./apps/wandee/support.html"
       style="font-size:13px; color:var(--text-muted);">ช่วยเหลือ</a>
  </div>
</article>
